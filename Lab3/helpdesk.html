<!DOCTYPE htm5>
<html lang="en">

<body>

<h1>Cat Show Registration Page</h1>

<form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

<p> 
    <label for="owner">Owner</label>
    <input type="text" name="Owner" id="owner">
</p>

<p> 
    <label for="email">Email</label>
    <input type="email" name="Email" id="email">
</p>

<fieldset>
    <legend>Cat Information Details</legend>

    <p>
        <label for="catname">Cat Name</label>
        <input type="text" name="CatName" id="catname">
    </p>

    <p>
        <label for="breed">Breed</label>
        <select name="Breed" id="breed">
            <option>British Shorthair</option>
            <option>Burmese</option>
            <option>Manx</option>
            <option>Ragdoll</option>
            <option>Russian Blue</option>
            <option>Siamese</option>
            <option>Other</option>
        </select>
    </p>

    <fieldset>
        <legend>Sex</legend>
        <label><input type="radio" name="sex" value="male"> Male</label><br>
        <label><input type="radio" name="sex" value="female"> Female</label>
    </fieldset>

    <fieldset>
        <legend>Competition Categories</legend>
        <label><input type="checkbox" name="category[]" value="best"> Best Of Breed</label><br>
        <label><input type="checkbox" name="category[]" value="cutest"> Cutest</label><br>
        <label><input type="checkbox" name="category[]" value="ugliest"> Ugliest</label>
    </fieldset>

</fieldset>

<p> 
    <label for="comments">Comments</label>
    <input type="text" name="Comments" id="comments">
</p>

<p>
    <input type="submit" value="Submit Survey">
    <input type="reset" value="Reset">
</p>

</form>

</body>
